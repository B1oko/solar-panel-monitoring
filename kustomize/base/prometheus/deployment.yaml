apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: solar-panel-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yaml
          subPath: prometheus.yaml
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
